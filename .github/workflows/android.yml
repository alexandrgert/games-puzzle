name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-debug-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate catalog
        run: |
          python -m pip install jsonschema
          python -m jsonschema \
            -i app/src/main/assets/catalog.json \
            docs/schemas/catalog.schema.json

      - name: Verify version sync
        run: python scripts/check_version_sync.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Test and assemble debug APK
        run: ./gradlew test assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: games-puzzle-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release-build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read release version
        id: version
        run: echo "value=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Check release signing secrets
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] ||
             [ -z "$ANDROID_KEYSTORE_PASSWORD" ] ||
             [ -z "$ANDROID_KEY_ALIAS" ] ||
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Release signing secrets are required on main." >&2
            exit 1
          fi

      - name: Restore Android keystore
        run: python scripts/write_android_keystore_from_env.py

      - name: Assemble signed release APK
        run: ./gradlew assembleRelease

      - name: Name release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk \
            "games-puzzle-${{ steps.version.outputs.value }}.apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: games-puzzle-${{ steps.version.outputs.value }}.apk
          path: games-puzzle-${{ steps.version.outputs.value }}.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-and-debug-build, signed-release-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Validate release tag
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: games-puzzle-${{ env.version }}.apk
          path: release-artifact

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release-artifact/games-puzzle-${version}.apk" \
            --title "Games Puzzle ${version}" \
            --notes-file "docs/github-release-v${version}.md" \
            --verify-tag
